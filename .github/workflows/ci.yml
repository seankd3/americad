name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Count tests
        run: npm run test:count
      
      - name: Run Playwright tests
        run: npm test
        continue-on-error: true  # Until tests are fully set up

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify structure
        run: |
          echo "Checking required files..."
          test -f app.js
          test -f index.html
          test -d src
          test -d tests
          echo "✅ All required files present"
      
      - name: Count source files
        run: |
          echo "Source files:"
          find src -name "*.js" | wc -l
          echo "Test files:"
          find tests -name "*.test.js" -o -name "*.test.mjs" | wc -l
