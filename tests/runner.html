<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ameri-CAD Test Suite</title>
    
    <!-- Mocha CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mocha@10.2.0/mocha.css">
    
    <style>
        body {
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            background: #0a0a0b;
            color: #e0e0e5;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(90deg, #1a1a1f 0%, #0a0a0b 100%);
            border: 1px solid #35353a;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #e8b13f;
            font-size: 24px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }
        
        .header .version {
            color: #6a6a70;
            font-size: 11px;
            text-transform: uppercase;
        }
        
        #mocha {
            background: #12121a;
            border: 1px solid #35353a;
            border-radius: 4px;
            padding: 20px;
            margin: 0;
        }
        
        #mocha h1, #mocha h2 {
            color: #e8b13f;
        }
        
        #mocha .test.pass::before {
            color: #44ff44;
        }
        
        #mocha .test.fail::before {
            color: #ff4444;
        }
        
        #mocha .test {
            color: #e0e0e5;
        }
        
        #mocha .suite {
            margin-left: 0;
        }
        
        #mocha .test.pass .duration {
            color: #6a6a70;
        }
        
        /* Hidden canvas for Three.js tests */
        #test-canvas {
            position: absolute;
            left: -9999px;
            width: 100px;
            height: 100px;
        }
    </style>
    
    <!-- Three.js for geometry tests -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="header">
        <h1>◆ Ameri-CAD TEST SUITE</h1>
        <div class="version">VER 2.0.1-LA // AUTOMATED VALIDATION</div>
    </div>
    
    <!-- Hidden canvas for WebGL tests -->
    <canvas id="test-canvas"></canvas>
    
    <!-- Mocha container -->
    <div id="mocha"></div>
    
    <!-- Chai Assertion Library -->
    <script src="https://cdn.jsdelivr.net/npm/chai@4.3.7/chai.js"></script>
    
    <!-- Mocha Test Framework -->
    <script src="https://cdn.jsdelivr.net/npm/mocha@10.2.0/mocha.js"></script>
    
    <script>
        // Setup Mocha
        mocha.setup({
            ui: 'bdd',
            timeout: 10000,
            reporter: 'html'
        });
        
        // Make chai.expect global
        window.expect = chai.expect;
        window.assert = chai.assert;
    </script>
    
    <!-- Setup Three.js and load tests -->
    <script type="module">
        import * as THREE from 'three';
        
        // Export THREE to window for tests
        window.THREE = THREE;
        
        // Load test files
        // Each test file imports what it needs and exposes GeometryUtils to window
        const testModules = [
            './math.test.js',
            './primitives.test.js',
            './history.test.js',
            './kernel-primitives.test.js',
            './extrude.test.js',
            './file-io.test.js',
            './viewport-manager.test.js'
        ];
        
        async function loadTests() {
            for (const module of testModules) {
                try {
                    await import(module);
                    console.log(`Loaded: ${module}`);
                } catch (e) {
                    console.error(`Failed to load ${module}:`, e);
                    // Show error in mocha
                    const errorDiv = document.createElement('div');
                    errorDiv.style.cssText = 'color: #ff4444; padding: 10px; margin: 10px 0; background: #1a0000; border: 1px solid #ff4444;';
                    errorDiv.textContent = `Failed to load ${module}: ${e.message}`;
                    document.getElementById('mocha').prepend(errorDiv);
                }
            }
            
            // Run tests
            mocha.run();
        }
        
        // Wait for DOM then load tests
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadTests);
        } else {
            loadTests();
        }
    </script>
</body>
</html>
